# Apache vhost for combined deployment on ohoecom.developmentalphawizz.com
# Admin SPA: document root
# Vendor SPA: /vendor/
# API + uploads: reverse-proxy to Node on 127.0.0.1:5017 (required for mobile)
#
# Install (as root on the server):
#   sudo cp deploy/apache-ohoecom-combined.conf /etc/apache2/sites-available/ohoecom.conf
#   sudo a2enmod proxy proxy_http rewrite headers ssl
#   sudo a2ensite ohoecom.conf
#   sudo apache2ctl configtest && sudo systemctl reload apache2
#
# Adjust DocumentRoot and SSL certificate paths for your server.

<VirtualHost *:80>
    ServerName ohoecom.developmentalphawizz.com

    DocumentRoot /var/www/ohoecom/AdminPannel/dist

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "http"

    # API + uploads -> Node (phones cannot open :5017; Apache on 443 must proxy both)
    ProxyPass        /api      http://127.0.0.1:5017/api
    ProxyPassReverse /api      http://127.0.0.1:5017/api
    ProxyPass        /uploads  http://127.0.0.1:5017/uploads
    ProxyPassReverse /uploads  http://127.0.0.1:5017/uploads

    # Play Store legal pages + CMS WebViews -> Node (do not let SPA catch these)
    ProxyPass        /privacy-policy  http://127.0.0.1:5017/privacy-policy
    ProxyPassReverse /privacy-policy  http://127.0.0.1:5017/privacy-policy
    ProxyPass        /vendor/privacy-policy  http://127.0.0.1:5017/vendor/privacy-policy
    ProxyPassReverse /vendor/privacy-policy  http://127.0.0.1:5017/vendor/privacy-policy
    ProxyPass        /delivery/privacy-policy  http://127.0.0.1:5017/delivery/privacy-policy
    ProxyPassReverse /delivery/privacy-policy  http://127.0.0.1:5017/delivery/privacy-policy
    ProxyPass        /driver/privacy-policy  http://127.0.0.1:5017/driver/privacy-policy
    ProxyPassReverse /driver/privacy-policy  http://127.0.0.1:5017/driver/privacy-policy
    ProxyPass        /delete-account  http://127.0.0.1:5017/delete-account
    ProxyPassReverse /delete-account  http://127.0.0.1:5017/delete-account
    ProxyPass        /vendor/delete-account  http://127.0.0.1:5017/vendor/delete-account
    ProxyPassReverse /vendor/delete-account  http://127.0.0.1:5017/vendor/delete-account
    ProxyPass        /delivery/delete-account  http://127.0.0.1:5017/delivery/delete-account
    ProxyPassReverse /delivery/delete-account  http://127.0.0.1:5017/delivery/delete-account
    ProxyPass        /driver/delete-account  http://127.0.0.1:5017/driver/delete-account
    ProxyPassReverse /driver/delete-account  http://127.0.0.1:5017/driver/delete-account
    ProxyPass        /view     http://127.0.0.1:5017/view
    ProxyPassReverse /view     http://127.0.0.1:5017/view

    <Directory /var/www/ohoecom/AdminPannel/dist>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted

        RewriteEngine On
        RewriteBase /

        RewriteCond %{REQUEST_FILENAME} -f [OR]
        RewriteCond %{REQUEST_FILENAME} -d
        RewriteRule ^ - [L]

        RewriteRule ^vendor(/.*)?$ /vendor/index.html [L]
        RewriteRule ^ /index.html [L]
    </Directory>
</VirtualHost>

# After SSL (certbot), duplicate this block for *:443 with:
#   RequestHeader set X-Forwarded-Proto "https"
# and SSLEngine on + certificate paths.
