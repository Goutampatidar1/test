name: Production Deployment

on:
  push:
    branches: [ main ]

jobs:
  deploy-to-server:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: OhoEBazarWebsite/package-lock.json

      - name: Build public website
        working-directory: OhoEBazarWebsite
        run: |
          npm ci
          npm run build

      - name: Deploy repo snapshot
        uses: Burnett01/rsync-deployments@7.0.0
        with:
          switches: -avzr --exclude='.git*' --exclude='.github*' --exclude='.env' --exclude='/vendor/' --exclude='node_modules' --exclude='.mongodb-data' --exclude='.mongodb-local'
          path: ./
          remote_path: /home/${{ secrets.SERVER_USER }}/public_html/ohoebazar.com/
          remote_host: ${{ secrets.SERVER_IP }}
          remote_user: ${{ secrets.SERVER_USER }}
          remote_key: ${{ secrets.SSH_PRIVATE_KEY }}

      # Overlay built SPA + favicons at document root (keeps /admin /vendor /api intact).
      - name: Deploy website dist to document root
        uses: Burnett01/rsync-deployments@7.0.0
        with:
          switches: -avzr
          path: ./OhoEBazarWebsite/dist/
          remote_path: /home/${{ secrets.SERVER_USER }}/public_html/ohoebazar.com/
          remote_host: ${{ secrets.SERVER_IP }}
          remote_user: ${{ secrets.SERVER_USER }}
          remote_key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy document-root htaccess
        uses: Burnett01/rsync-deployments@7.0.0
        with:
          switches: -avzr
          path: ./deploy/public_html.htaccess
          remote_path: /home/${{ secrets.SERVER_USER }}/public_html/ohoebazar.com/.htaccess
          remote_host: ${{ secrets.SERVER_IP }}
          remote_user: ${{ secrets.SERVER_USER }}
          remote_key: ${{ secrets.SSH_PRIVATE_KEY }}

      # API process may run outside public_html (keeps its own .env). Sync code into that cwd, then PM2 reload.
      - name: Sync Backend into live API cwd and restart PM2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            SRC="$HOME/public_html/ohoebazar.com/Backend"
            echo "Source: $SRC"
            test -f "$SRC/controllers/vendorControllers/vendorMobileAuth.js"

            PID=""
            if command -v ss >/dev/null 2>&1; then
              PID=$(ss -ltnp 2>/dev/null | grep ':5017' | head -1 | grep -oP 'pid=\K[0-9]+' || true)
            fi
            if [ -z "$PID" ] && command -v lsof >/dev/null 2>&1; then
              PID=$(lsof -t -iTCP:5017 -sTCP:LISTEN 2>/dev/null | head -1 || true)
            fi
            echo "PID on :5017 = '${PID:-unknown}'"
            pm2 list || true

            TARGET=""
            if [ -n "$PID" ] && [ -d "/proc/$PID/cwd" ]; then
              TARGET=$(readlink -f "/proc/$PID/cwd" || true)
            fi
            if [ -z "$TARGET" ] || [ ! -d "$TARGET" ]; then
              # Fallbacks used on this host historically
              for cand in \
                "$HOME/ohoebazar-api/Backend" \
                "$HOME/apps/ohoebazar/Backend" \
                "$HOME/nodejs/ohoebazar/Backend" \
                "$HOME/public_html/ohoebazar.com/Backend"
              do
                if [ -f "$cand/server.js" ]; then TARGET="$cand"; break; fi
              done
            fi
            echo "API target cwd: $TARGET"
            test -n "$TARGET"
            test -f "$TARGET/server.js"

            # Copy application code only — never overwrite live .env / node_modules / uploads
            rsync -a --delete \
              --exclude '.env' \
              --exclude '.env.*' \
              --exclude 'node_modules' \
              --exclude 'uploads' \
              --exclude '.mongodb-data' \
              --exclude '.mongodb-local' \
              "$SRC/" "$TARGET/"

            grep -n "service-login-2026-10-17" "$TARGET/controllers/vendorControllers/vendorMobileAuth.js" | head -2

            if command -v pm2 >/dev/null 2>&1; then
              if pm2 describe oho-backend >/dev/null 2>&1; then
                pm2 restart oho-backend --update-env
              else
                # Restart every online app as a fallback when the name differs
                pm2 restart all --update-env || pm2 start "$TARGET/server.js" --name oho-backend --cwd "$TARGET"
              fi
              pm2 save || true
            else
              echo "pm2 missing"
              exit 1
            fi

            sleep 3
            echo "check-phone after reload:"
            curl -s -X POST "http://127.0.0.1:5017/api/vendor/auth/check-phone" \
              -H "Content-Type: application/json" \
              -d '{"phone":"9650555555","purpose":"vendor_login"}' || true
            echo
